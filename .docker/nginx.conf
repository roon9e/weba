server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # The bundle is content-hashed, so it can be cached hard; index.html is not
    # and must never be, or a deploy would keep serving the old asset names.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires    -1;
    }

    # nginx's stock mime.types has no entry for `.webmanifest`, so the manifest
    # would be served as a download and the browser would ignore it — no install
    # prompt, no shortcuts. `default_type` rather than a `types` block: a block
    # replaces the inherited map for this server and every other extension would
    # fall back to octet-stream, which breaks the app's ES modules outright.
    #
    # Copied verbatim from public/, so unhashed: a long cache here would pin the
    # installed app's name, colours and shortcuts to whatever a deploy shipped.
    location ~* ^/site[^/]*\.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-store, must-revalidate";
        expires    -1;
    }

    # Vite emits `name-HASH.ext`, so the name changes whenever the bytes do. The
    # service worker is one of these (see `worker.rolldownOptions` in
    # vite.config.ts), which is why it is covered here rather than by name.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|webp|gif|wasm|mp3|mp4|webm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files  $uri =404;
    }

    location ~* ^/(?:browserconfig\.xml|build-stats\.json)$ {
        add_header Cache-Control "no-store, must-revalidate";
        expires    -1;
    }

    location / {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # MTProto transport paths, when a custom backend is configured. A glob, so
    # this is a no-op without the file. See nginx.transport.conf.
    include /etc/nginx/conf.d/transport/*.conf;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/wasm image/svg+xml;

    server_tokens off;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options        SAMEORIGIN;
    add_header Referrer-Policy        strict-origin-when-cross-origin;
}