# MTProto transport proxy, included from default.conf *inside* its server block,
# and mounted only when the build points at a custom backend (TG_DC_HOST /
# TG_DC_PORT in .env).
#
# It is a separate file on purpose. nginx resolves a literal proxy_pass host when
# it starts, so having `host.docker.internal` in default.conf would stop nginx
# from starting at all on a host that does not serve a custom backend. The
# include in default.conf is a glob, so a deployment without this file simply
# matches nothing.
#
# `host.docker.internal` is mapped to the docker host gateway by the compose
# file's extra_hosts, so the backend is reached over the docker bridge rather
# than out to the public address and back. The port here must match TG_DC_PORT.

location ~ ^/(?:apiws|apiw1|apiws_premium|apiw1_premium)(?:_premium)?$ {
    proxy_pass http://host.docker.internal:45789;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The abridged transport is a raw byte stream; an upstream content type here
    # would make the client reject the response as a bad MIME type.
    proxy_hide_header Content-Type;

    # The stream is long-lived and mostly idle, so the default 60s read timeout
    # would drop an authenticated session.
    proxy_read_timeout  24h;
    proxy_send_timeout  24h;
    proxy_buffering     off;
}